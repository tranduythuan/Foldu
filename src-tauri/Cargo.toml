[package]
name = "foldu"
version = "1.2.0"
description = "Foldu - sap xep va don file tu dong, an toan, hoan tac duoc"
authors = ["Tran Duy Thuan"]
homepage = "https://tranduythuan.com"
repository = "https://github.com/tranduythuan/foldu"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "foldu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
blake3 = "1"
chrono = "0.4"
trash = "5"
kamadak-exif = "0.5"
imagesize = "0.13"
# Chi bat JPEG va PNG: du de bam anh gan giong, tranh keo theo ca chuc dinh dang
# khong dung toi lam phinh file va cham bien dich.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
unicode-normalization = "0.1"
once_cell = "1"
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
